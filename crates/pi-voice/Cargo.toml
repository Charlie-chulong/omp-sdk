[package]
name = "pi-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["live"]
live = ["dep:bytes", "dep:opus", "dep:parking_lot", "dep:webrtc"]

[dependencies]
bytes = { workspace = true, optional = true }
flume.workspace = true
opus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tokio.workspace = true
webrtc = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# dlopen/dlsym for the PulseAudio and ALSA backends: no link-time dependency
# on libpulse/libasound, so the prebuilt addon loads on systems without them.
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
