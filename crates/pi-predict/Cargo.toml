[package]
name = "pi-predict"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["smollm"]
smollm = ["dep:candle-core", "dep:candle-nn", "dep:rayon", "dep:regex", "dep:serde", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
rayon = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zstd.workspace = true

# Optional SmolLM2 runs on the GPU through candle's Metal backend on macOS;
# its portable CPU decoder (src/smollm/cpu.rs) needs no ML framework.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"], optional = true }
candle-nn = { workspace = true, features = ["metal"], optional = true }
# The `apple` engine and the process-wide AppKit spelling thread
# (`apple::appkit`, shared with `pi_natives::spelling`).
flume.workspace = true
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
